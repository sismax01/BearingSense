[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bearingsense"
version = "0.1.0"
description = "Explainable Machine Learning and Envelope Spectrum Diagnostics for Industrial Bearing Vibration Signals"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "sismax01"}
]
keywords = [
    "bearing-fault-diagnosis",
    "condition-monitoring",
    "vibration-analysis",
    "envelope-spectrum",
    "explainable-ai",
    "machine-learning",
    "automatic-control",
    "signal-processing"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "PyYAML>=6.0",
    "tabulate>=0.9.0",
    "Jinja2>=3.1.0",
    "fastapi>=0.90.0",
    "uvicorn>=0.17.0",
    "python-multipart>=0.0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/sismax01/BearingSense"
Repository = "https://github.com/sismax01/BearingSense"
Issues = "https://github.com/sismax01/BearingSense/issues"

[project.scripts]
bearingsense = "bearingsense.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
