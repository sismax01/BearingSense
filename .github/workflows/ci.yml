name: BearingSense CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies and BearingSense package
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Verify syntax and compile all Python modules
        run: |
          python -m compileall -q src tests

      - name: Run unit and integration test suite
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run end-to-end synthetic verification pipeline
        run: |
          bearingsense demo --output-dir outputs/ci_demo --seed 42
